<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#f5f5f3" />
<title>SeedCount</title>
<meta name="description" content="照片种子计数工具" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <main class="workspace">
    <aside class="sidebar" aria-label="计数操作">
      <section class="side-section">
        <div class="section-head">
          <h2>照片</h2>
        </div>
        <button class="upload" id="dropzone" type="button" aria-label="选择或拖入照片">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
          </svg>
          <span>选择照片</span>
        </button>
        <button class="btn btn-secondary full" id="takePhoto" type="button" hidden>拍照</button>
        <div class="file-row" id="fileCard" hidden>
          <img class="file-thumb" id="fileThumb" alt="" />
          <div class="file-meta">
            <div class="file-name" id="fileName"></div>
            <div class="file-dim" id="fileDim"></div>
          </div>
          <button class="text-btn" id="changePhoto" type="button">更换</button>
        </div>
      </section>

      <section class="side-section">
        <div class="section-head">
          <h2>计数区域</h2>
          <span class="status" id="roiTag">自动</span>
        </div>
        <div class="button-row">
          <button class="btn btn-secondary grow" id="roiBtn" type="button" disabled>添加区域</button>
          <button class="btn btn-quiet" id="roiClear" type="button" hidden>清除</button>
        </div>
      </section>

      <section class="side-section side-action">
        <button class="btn btn-primary full" id="countBtn" type="button" disabled>开始计数</button>
        <div class="progress" id="progressBox" hidden>
          <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
          <div class="progress-text" id="stageText"></div>
        </div>
      </section>

      <section class="result" id="resultBody" hidden aria-live="polite">
        <div class="result-label">结果</div>
        <div class="result-count"><strong id="mCount">-</strong><span>粒</span></div>
        <dl class="result-meta">
          <div><dt>中位粒径</dt><dd id="mDiameter">-</dd></div>
          <div><dt>耗时</dt><dd id="mElapsed">-</dd></div>
          <div><dt>区域</dt><dd id="mScope">-</dd></div>
        </dl>
        <div class="export-row">
          <button class="btn btn-secondary grow" id="saveImage" type="button">标注图</button>
          <button class="btn btn-secondary grow" id="viewTable" type="button">查看表格</button>
          <button class="btn btn-secondary grow" id="saveCsv" type="button">下载表格</button>
        </div>
      </section>
    </aside>

    <section class="viewer-wrap" aria-label="照片画布">
      <div class="viewer-bar" id="viewerToolbar" hidden>
        <div class="segmented" id="tabs" hidden>
          <button class="segmented-btn is-active" id="tabOriginal" type="button">原图</button>
          <button class="segmented-btn" id="tabResult" type="button">标注</button>
          <button class="segmented-btn" id="tabTable" type="button">表格</button>
        </div>
        <span class="viewer-file" id="viewerLabel"></span>
        <span class="spacer"></span>
        <button class="text-btn" id="zoomBtn" type="button" hidden>放大</button>
      </div>
      <div class="viewer" id="stage">
        <canvas id="overlayCanvas" class="viewer-media" hidden></canvas>
        <img id="photoView" class="viewer-media" alt="待计数照片" hidden />
        <div class="viewer-empty" id="emptyState" aria-hidden="true"></div>
        <div class="table-view" id="tableView" hidden>
          <div class="table-view-head">
            <span>逐粒结果</span>
            <strong id="tableSummary"></strong>
            <span class="spacer"></span>
            <button class="btn btn-secondary" id="tableDownload" type="button">下载表格</button>
          </div>
          <div class="table-scroll">
            <table class="seed-table">
              <thead>
                <tr>
                  <th>序号</th>
                  <th>中心 X</th>
                  <th>中心 Y</th>
                  <th>面积</th>
                  <th>等效直径</th>
                  <th>置信度</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
        <div class="count-badge" id="countBadge" hidden><b id="countNum">0</b><span>粒</span></div>
        <div class="viewer-busy" id="busyOverlay" hidden>
          <i class="spinner" aria-hidden="true"></i>
          <span id="busyText"></span>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="roi-modal" id="roiModal" hidden role="dialog" aria-modal="true" aria-label="选择计数区域">
  <div class="roi-head">
    <span class="roi-title">选择区域</span>
    <div class="roi-tools" id="roiTools" role="group" aria-label="区域形状">
      <button class="roi-tool is-active" data-id="rect" type="button">矩形</button>
      <button class="roi-tool" data-id="circle" type="button">圆形</button>
      <button class="roi-tool" data-id="polygon" type="button">多边形</button>
      <button class="roi-tool" data-id="freehand" type="button">手绘</button>
    </div>
    <span class="roi-count" id="roiCounter">0 个区域</span>
  </div>
  <div class="roi-stage">
    <canvas id="roiCanvas"></canvas>
    <span class="roi-hint" id="roiHint2">拖动绘制</span>
  </div>
  <div class="roi-foot">
    <div class="roi-foot-group">
      <button class="btn btn-dark" id="roiUndo" type="button">撤销</button>
      <button class="btn btn-dark" id="roiReset" type="button">清空</button>
    </div>
    <span class="spacer"></span>
    <div class="roi-foot-group roi-foot-actions">
      <button class="btn btn-dark" id="roiCancel" type="button">取消</button>
      <button class="btn btn-dark-accent" id="roiAdd" type="button" disabled>添加区域</button>
      <button class="btn btn-primary" id="roiOk" type="button">完成</button>
    </div>
  </div>
</div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden />
<input type="file" id="albumInput" accept="image/*" hidden />

<script src="vendor/ort/ort.wasm.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
